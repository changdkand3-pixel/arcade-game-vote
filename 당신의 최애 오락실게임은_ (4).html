<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>당신의 최애 오락실게임은?</title>
<style>
:root{--bg:#f4f5fb;--card:#fff;--tx:#1b1d2a;--mu:#6b6f85;--ac:#5b3df5;--ac2:#ffcf1f;--bd:#e1e3ef;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1020;--card:#191c33;--tx:#f1f2fb;--mu:#9a9fc0;--ac:#8b78ff;--bd:#2a2e50}}
:root[data-theme="dark"]{--bg:#0e1020;--card:#191c33;--tx:#f1f2fb;--mu:#9a9fc0;--ac:#8b78ff;--bd:#2a2e50}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;padding-bottom:90px}
header{padding:16px 14px 8px;text-align:center}
h1{margin:0;font-size:22px;background:linear-gradient(90deg,#ffcf1f,#ff5fc8);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mu);font-size:13px;margin-top:4px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 12px;display:flex;gap:8px;align-items:center}
.tabs{display:flex;flex:1;background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.tabs button{flex:1;border:0;background:none;color:var(--mu);padding:10px;font-size:15px;font-weight:600}
.tabs button.on{background:var(--ac);color:#fff}
.btn{border:0;border-radius:12px;padding:10px 14px;background:var(--ac);color:#fff;font-weight:700;font-size:14px}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:6px 12px}
@media(min-width:600px){.grid{grid-template-columns:repeat(5,1fr)}}
@media(min-width:900px){.grid{grid-template-columns:repeat(8,1fr)}}
.g{position:relative;border-radius:12px;overflow:hidden;background:var(--card);border:2px solid var(--bd);padding:0;cursor:pointer;color:var(--tx);text-align:center}
.g img{display:block;width:100%;aspect-ratio:150/180;object-fit:cover}
.g .ph{aspect-ratio:150/180;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;padding:8px;background:linear-gradient(135deg,#3b2bd1,#d93fa6);color:#fff}
.g.sel{border-color:var(--ac2);box-shadow:0 0 0 3px var(--ac2)}
.g .ck{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:var(--ac2);color:#000;font-weight:800;display:none;align-items:center;justify-content:center}
.g.sel .ck{display:flex}
.g .cnt{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.7);color:#fff;font-size:12px;border-radius:10px;padding:2px 7px}
.res{padding:6px 12px}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px;margin-bottom:8px}
.row img,.row .ph2{width:44px;height:52px;border-radius:8px;object-fit:cover;flex:none}
.ph2{background:linear-gradient(135deg,#3b2bd1,#d93fa6)}
.rk{width:24px;text-align:center;font-weight:800;color:var(--ac)}
.rb{flex:1;min-width:0}.rn{font-size:14px;font-weight:700;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}.fl{height:100%;background:linear-gradient(90deg,var(--ac),#ff5fc8)}
.rv{font-weight:800;min-width:34px;text-align:right}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;z-index:6}
.foot .t{flex:1;font-size:13px;color:var(--mu)}
.note{margin:6px 12px;padding:10px;border-radius:10px;background:var(--card);border:1px solid var(--bd);font-size:12px;color:var(--mu)}
dialog{border:0;border-radius:16px;padding:18px;background:var(--card);color:var(--tx);width:min(92vw,360px)}
dialog::backdrop{background:rgba(0,0,0,.5)}
input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px;margin:8px 0}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:20;display:none}
</style></head><body>
<header><h1>🕹️ 당신의 최애 오락실게임은?</h1><div class="sub">게임을 눌러 최대 <b id="mx">3</b>개까지 고르고 투표하세요</div></header>
<div id="note" class="note" style="display:none"></div>
<div class="bar"><div class="tabs"><button id="t1" class="on">투표하기</button><button id="t2">결과 보기</button></div><button class="btn g" id="add">＋ 추가</button></div>
<div id="v1" class="grid"></div><div id="imp" class="res" style="display:none"><div class="note" style="margin:0 0 8px"><b>📥 단톡방 투표 집계</b><br>사람들이 올린 투표 메시지를 단톡방에서 복사해 아래에 붙여넣고 [집계하기]를 누르면 결과에 합쳐져요.</div><textarea id="imt" rows="5" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:14px" placeholder="여기에 붙여넣기"></textarea><button class="btn" id="imb" style="width:100%;margin-top:8px">집계하기</button></div><div id="v2" class="res" style="display:none"></div>
<div class="foot"><div class="t" id="st">0개 선택</div><button class="btn g" id="share">📤 공유</button><button class="btn" id="vote">투표 저장</button></div>
<dialog id="dn"><b>닉네임</b><input id="nick" maxlength="12" placeholder="단톡방에서 쓰는 이름"><button class="btn" id="nok" style="width:100%">확인</button></dialog>
<dialog id="da"><b>새 게임 추가</b><input id="gn" maxlength="30" placeholder="게임 이름"><button class="btn" id="gok" style="width:100%">추가하기</button></dialog>

let IMP={}, XC=[], custom=[], votes={}, picks=new Set(), db=null, uid=null, nick="", tab=1, dirty=false;
const $=id=>document.getElementById(id);
const all=()=>BASE.concat(custom,XC);
function enc(){const o={v:{},c:custom.filter(g=>g.local).map(g=>g.n)};Object.entries(votes).forEach(([k,x])=>{if(k.startsWith('h:'))o.v[k.slice(2)]=x.picks});return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function dec(t){try{t=t.replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(decodeURIComponent(escape(atob(t))))}catch(e){return null}}
function link(){const b=location.href.split('#')[0];return db?b:b+'#'+enc()}
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2200)}
function tally(){const c={};Object.values(votes).concat(Object.values(IMP)).forEach(v=>(v.picks||[]).forEach(p=>c[p]=(c[p]||0)+1));return c}
function cell(g,cnt){const b=document.createElement('button');b.className='g'+(picks.has(g.id)?' sel':'');
 b.innerHTML=(g.img?'<img alt="" src="'+g.img+'">':'<div class="ph"></div>')+'<span class="ck">✓</span>'+(cnt?'<span class="cnt">'+cnt+'표</span>':'');
 if(!g.img)b.querySelector('.ph').textContent=g.n;
 b.onclick=()=>{if(picks.has(g.id))picks.delete(g.id);else{if(picks.size>=MAX)return toast('최대 '+MAX+'개까지 선택할 수 있어요');picks.add(g.id)}dirty=true;render()};return b}
function render(){
 const c=tally();$('mx').textContent=MAX;
 const v1=$('v1');v1.innerHTML='';all().forEach(g=>v1.appendChild(cell(g,c[g.id]||0)));
 const n=Object.keys(votes).length+Object.keys(IMP).length;
 const list=all().map(g=>({g,c:c[g.id]||0})).sort((a,b)=>b.c-a.c||0);
 const mxv=Math.max(1,...list.map(x=>x.c));
 const v2=$('v2');v2.innerHTML='<div class="sub" style="text-align:center;margin-bottom:8px">참여 '+n+'명 · 총 '+Object.values(c).reduce((a,b)=>a+b,0)+'표</div>';
 list.forEach((x,i)=>{const r=document.createElement('div');r.className='row';
  r.innerHTML='<div class="rk">'+(i+1)+'</div>'+(x.g.img?'<img alt="" src="'+x.g.img+'">':'<div class="ph2"></div>')+'<div class="rb"><div class="rn"></div><div class="tr"><div class="fl" style="width:'+(x.c/mxv*100)+'%"></div></div></div><div class="rv">'+x.c+'</div>';
  r.querySelector('.rn').textContent=x.g.n;v2.appendChild(r)});
 $('st').textContent=picks.size+'/'+MAX+' 선택';
}
function setTab(t){tab=t;$('t1').className=t==1?'on':'';$('t2').className=t==2?'on':'';$('v1').style.display=t==1?'':'none';$('v2').style.display=t==2?'':'none';$('imp').style.display=t==2?'':'none'}
$('t1').onclick=()=>setTab(1);$('t2').onclick=()=>setTab(2);
function askNick(){return new Promise(r=>{const d=$('dn');$('nick').value=nick;d.showModal();$('nok').onclick=()=>{const v=$('nick').value.trim();if(!v)return;nick=v;try{localStorage.setItem('nick',v)}catch(e){}d.close();r(v)}})}
$('vote').onclick=async()=>{
 if(!picks.size)return toast('게임을 먼저 선택하세요');
 if(!nick)await askNick();
 const rec={picks:[...picks],name:nick,at:Date.now()};
 if(db&&uid){try{await db.collection('votes').doc(uid).set(rec);dirty=false;toast('투표 저장 완료! ✅');setTab(2)}catch(e){toast('저장 실패: 투표 권한이 없을 수 있어요')}}
 else{votes['h:'+nick]=rec;dirty=false;render();try{history.replaceState(null,'','#'+enc())}catch(e){}toast('저장됨! 📤 공유로 최신 링크를 단톡방에 올려주세요');setTab(2)}
};
$('add').onclick=()=>{$('gn').value='';$('da').showModal()};
$('gok').onclick=async()=>{const n=$('gn').value.trim();if(!n)return;
 if(all().some(g=>g.n.replace(/\s/g,'').toLowerCase()===n.replace(/\s/g,'').toLowerCase()))return toast('이미 있는 게임이에요');
 $('da').close();
 if(db){try{const ref=db.collection('custom').doc();await ref.set({n,by:nick||''});toast('추가 완료! 투표해 보세요');}catch(e){toast('추가 권한이 없어요')}}
 else{custom.push({id:'x:'+n,n,local:true});render()}};
function summary(){const c=tally();const code=(nick&&picks.size)?'\n내 투표 [['+nick+'|'+[...picks].join(',')+']]':'';const top=all().map(g=>({n:g.n,c:c[g.id]||0})).sort((a,b)=>b.c-a.c).slice(0,5).filter(x=>x.c>0);
 return '🕹️ 당신의 최애 오락실게임은?\n'+(top.length?top.map((x,i)=>(i+1)+'위 '+x.n+' ('+x.c+'표)').join('\n')+'\n':'')+code+'\n👉 투표하러 가기\n'+link()}
$('share').onclick=async()=>{const text=summary();
 try{if(navigator.share){await navigator.share({title:'최애 오락실게임 투표',text});return}}catch(e){if(e&&e.name==='AbortError')return}
 try{await navigator.clipboard.writeText(text);toast('복사됨! 단톡방에 붙여넣기 하세요 📋')}catch(e){prompt('복사해서 단톡방에 붙여넣으세요',text)}};
$('imb').onclick=()=>{const re=/[\[［]{2}\s*([^|｜\]］]+?)\s*[|｜]\s*([^\]］]*?)\s*[\]］]{2}/g;const t=$('imt').value;let m,k=0;while((m=re.exec(t))){const ids=m[2].split(',').map(s=>s.trim()).filter(Boolean);ids.forEach(id=>{if(id.startsWith('x:')&&!XC.some(g=>g.id===id))XC.push({id,n:id.slice(2)})});const ok=ids.filter(id=>all().some(g=>g.id===id)).slice(0,MAX);IMP[m[1].trim()]={picks:ok,name:m[1].trim()};k++}render();toast(k?k+'명의 투표를 집계했어요':'붙여넣은 글에서 투표 코드를 못 찾았어요');if(k)$('imt').value=''};
try{nick=localStorage.getItem('nick')||''}catch(e){}
(function(){const o=dec((location.hash||'').slice(1));if(!o)return;(o.c||[]).forEach(n=>{if(!custom.some(g=>g.n===n))custom.push({id:'x:'+n,n,local:true})});Object.entries(o.v||{}).forEach(([k,p])=>{if(Array.isArray(p))votes['h:'+k]={picks:p,name:k}})})();
render();
(async()=>{
 try{db=await claude.use('db');const u=await claude.use('user');if(u&&u.id)uid=await u.id()}catch(e){}
 if(!db||!uid){db=null;const n=$('note');n.style.display='';n.textContent='지금은 실시간 공유가 꺼진 화면이에요. 투표 후 📤 공유로 “최신 링크”를 단톡방에 올리면, 그 링크를 여는 사람에게 지금까지의 투표가 이어져요.';return}
 db.collection('custom').onSnapshot(s=>{custom=s.docs.map(d=>({id:d.id,n:String(d.data().n||'')})).filter(g=>g.n);render()},()=>{});
 db.collection('votes').onSnapshot(s=>{votes={};s.docs.forEach(d=>votes[d.id]=d.data());
  if(!dirty&&votes[uid]){picks=new Set(votes[uid].picks||[]);if(!nick)nick=votes[uid].name||''}render()},()=>{});
})();
